<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1EC;--card:#FBFCFA;--ink:#1E2B28;--mute:#55645F;--line:#D5DDD7;--acc:#2E6B5A;--accfg:#fff;--soft:#DCE9E3;--r:10px;--rl:12px;--rs:8px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141A19;--card:#1C2523;--ink:#E6EEEA;--mute:#8FA19B;--line:#2B3835;--acc:#6FC2A8;--accfg:#10201B;--soft:#24342F}}
:root[data-theme="dark"]{--bg:#141A19;--card:#1C2523;--ink:#E6EEEA;--mute:#8FA19B;--line:#2B3835;--acc:#6FC2A8;--accfg:#10201B;--soft:#24342F}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Readex Pro",Tahoma,"Segoe UI",sans-serif;line-height:1.7}
main{max-width:640px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px}
h1{font-size:20px;font-weight:600;margin:0;line-height:1.25;white-space:nowrap}
.date{color:var(--mute);font-size:14px}
.prog{font-size:12px;color:var(--mute);display:flex;flex-direction:row-reverse;align-items:center;gap:6px;text-align:right;max-width:38%;line-height:1.3}
.prog b{display:inline-block;font-size:24px;color:var(--acc);font-weight:600;line-height:1;flex:none}
nav{overflow-x:auto;display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:var(--rl);margin-bottom:16px}
nav button{flex:0 0 auto;white-space:nowrap;border:0;background:none;color:var(--mute);font:inherit;padding:8px 14px;border-radius:var(--rs);cursor:pointer}
nav button[aria-selected=true]{background:var(--card);color:var(--ink);font-weight:600}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.add{display:flex;gap:8px;margin-bottom:12px}
input,textarea{flex:1;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
textarea{resize:vertical;min-height:70px}
.btn{font:inherit;background:var(--acc);color:var(--accfg);border:0;border-radius:var(--r);padding:10px 16px;cursor:pointer;font-weight:600}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:8px}
.row .t{flex:1;overflow-wrap:anywhere}
.row.done .t{color:var(--mute);text-decoration:line-through}
.chk{width:22px;height:22px;border-radius:50%;border:1px solid var(--acc);background:none;cursor:pointer;flex:none;color:var(--accfg);font-size:13px;line-height:1}
.done .chk{background:var(--acc)}
.x{border:0;background:none;color:var(--mute);cursor:pointer;font-size:18px;padding:2px 6px}
.days{display:flex;gap:5px;direction:rtl}
.d{width:26px;height:26px;border-radius:var(--rs);border:1px solid var(--line);background:none;cursor:pointer;font:inherit;font-size:11px;color:var(--mute);padding:0}
.d.on{background:var(--acc);border-color:var(--acc);color:var(--accfg)}
.d.today{border-color:var(--acc);border-width:2px}
.streak{font-size:12px;color:var(--mute)}
.hab{flex-wrap:wrap}
.note{display:block}
.note small{color:var(--mute)}
.note p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.sub{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.sub h3{margin:0 0 8px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.les{flex-wrap:wrap;display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.les .t{flex:1;overflow-wrap:anywhere}
.tag{font-size:12px;padding:1px 8px;border-radius:var(--rl);background:var(--soft);color:var(--mute);white-space:nowrap}
.tag.w{background:var(--acc);color:var(--accfg)}
.les input[type=number]{flex:none;width:60px;padding:4px 6px;text-align:center}
.tip{background:var(--soft);border-radius:var(--r);padding:10px 12px;margin-bottom:12px;font-size:14px}
.clock{font-size:64px;font-weight:300;text-align:center;font-variant-numeric:tabular-nums;margin:12px 0;direction:ltr}
.ctl{display:flex;gap:8px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.btn.o{background:none;color:var(--ink);border:1px solid var(--line)}
select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;width:100%;margin-bottom:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:row-reverse;align-items:center;justify-content:space-between;gap:10px}
.stat b{display:block;font-size:22px;color:var(--acc);font-weight:600;line-height:1.2;flex:none;max-width:55%;overflow-wrap:anywhere}
.stat span{font-size:12.5px;color:var(--mute);line-height:1.35;flex:1;min-width:0}
.bars{display:flex;gap:6px;align-items:flex-end;height:70px;direction:rtl}
.bars div{flex:1;background:var(--acc);border-radius:var(--rs) var(--rs) 0 0;min-height:2px}
.msg{padding:10px 12px;border-radius:var(--rl);margin-bottom:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{background:var(--soft)}.msg.a{background:var(--card);border:1px solid var(--line)}
input[type=range]{padding:0;flex:none;width:90px}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:8px;max-width:600px;margin:0 auto;background:var(--acc);color:var(--accfg);padding:10px 14px;border-radius:var(--rl);z-index:9;display:flex;justify-content:space-between;gap:8px}
#toast[hidden]{display:none}
.empty{color:var(--mute);text-align:center;padding:28px 0}
@media (prefers-reduced-motion:no-preference){.row{transition:background .15s}}

::placeholder{color:var(--mute);opacity:1}
.fx{flex:1 1 140px;min-width:0}
#cq{width:100%;display:block}
#themes[hidden]{display:none}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;margin-bottom:16px}
.tcard{border:1px solid var(--line);border-radius:var(--r);padding:8px;cursor:pointer;text-align:center;font:inherit;font-size:13px;background:var(--card);color:var(--ink)}
.tcard[aria-pressed=true]{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.tprev{display:block;height:46px;position:relative;margin-bottom:6px;overflow:hidden}
.tprev i{position:absolute;inset:8px 8px 14px 8px}
.tprev b{position:absolute;left:8px;right:40%;bottom:5px;height:5px;border-radius:var(--rl)}

/* ===== motion (classic): everything here is opacity/transform so it stays smooth; reduced-motion switches it all off ===== */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes rise{0%{opacity:0;transform:translateY(46px) scale(.86) rotate(-3deg)}65%{opacity:1;transform:translateY(-7px) scale(1.035) rotate(1deg)}100%{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.3) rotate(-18deg);opacity:0}55%{transform:scale(1.42) rotate(6deg);opacity:1}78%{transform:scale(.88) rotate(-2deg)}100%{transform:scale(1) rotate(0)}}
@keyframes slideOut{from{max-height:var(--h,90px)}to{opacity:0;transform:translateX(-28px) scale(.96);max-height:0;margin-top:0;margin-bottom:0;padding-top:0;padding-bottom:0;border-width:0}}
@keyframes shake{0%,100%{transform:translateX(0) rotate(0)}15%{transform:translateX(-9px) rotate(-1.5deg)}30%{transform:translateX(9px) rotate(1.5deg)}45%{transform:translateX(-7px) rotate(-1deg)}60%{transform:translateX(7px) rotate(1deg)}75%{transform:translateX(-3px)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(1.04)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes dropIn{0%{opacity:0;transform:translateY(-28px) scale(.92)}70%{opacity:1;transform:translateY(4px) scale(1.01)}100%{opacity:1;transform:none}}
body{animation:fadeIn .4s ease-out}
#view.enter>*{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
#view.enter>*:nth-child(2){animation-delay:45ms}
#view.enter>*:nth-child(3){animation-delay:90ms}
#view.enter>*:nth-child(4){animation-delay:135ms}
#view.enter>*:nth-child(5){animation-delay:180ms}
#view.enter>*:nth-child(6){animation-delay:225ms}
#view.enter>*:nth-child(7){animation-delay:270ms}
#view.enter>*:nth-child(8){animation-delay:315ms}
#view.enter>*:nth-child(9){animation-delay:360ms}
#view.enter>*:nth-child(10){animation-delay:405ms}
.row.new,.msg.new,.sub.new{animation:rise .38s cubic-bezier(.2,.8,.3,1) both}
.chk.pop,.d.pop{animation:pop .38s cubic-bezier(.2,.9,.3,1.3)}
.out{animation:slideOut .23s ease-in forwards;overflow:hidden;pointer-events:none}
.shake{animation:shake .5s ease-in-out}
#sbub{animation:pulse 1.3s ease-in-out infinite}
.clock.run{animation:breathe 2.4s ease-in-out infinite}
#view.enter .bar-in{animation:grow .8s .15s cubic-bezier(.2,.7,.2,1) both;transform-origin:right}

business:"أنت خبير مشاريع صغيرة وبيزنس مبتدئين في مصر وأونلاين، بتطلع مشاريع مربحة وسهلة البيع في أي مجال (خدمات، منتجات، منتجات رقمية، خدمات محلية، محتوى). معيار «سهل البيع» عندك: رأس مال صغير، طلب واضح، بتتشرح في جملة واحدة، أول بيعة خلال أسبوع، ناس بترجع تشتري تاني، ومهارة مش صعبة. اسأل سؤالين بس لو مش معروفين: ميزانيتك كام ومهاراتك ووقتك إيه، واستخدم ذاكرة_المستخدم والأفكار_المحفوظة. لكل مشروع قول: بيبيع إيه ولمين، ليه سهل البيع، حجم رأس المال (قليل/متوسط/كبير بدل أرقام مخترعة إلا لو هو قالك أرقامه)، إزاي تجيب أول ٣ عملاء في أسبوع بخطوات حقيقية، طريقة التسعير، أهم المخاطر، واختبار رخيص تتأكد بيه إن فيه طلب قبل ما تصرف (بيع مسبق أو تجربة على ٣ عملاء). وممكن تقيّم كل فكرة من ٥ على المعايير دي مع ذكر إنه تقدير مبني على المعايير مش على بيانات سوق. أي حساب ربح أو تعادل أو استرداد لازم يتم بالأداة ideas مع action=calc_profit بأرقام المستخدم، ممنوع الحساب بالتخمين. حدودك: مفيش ضمان ربح، ومالكش وصول لبيانات السوق أو الأسعار أو المنافسين النهارده، فمتخترعش حجم سوق أو أسعار أو إحصائيات. قول إن التراخيص والضرايب بتختلف حسب النشاط واتأكد من جهة رسمية أو محاسب. مش هتساعد في نصب أو منتجات مقلدة أو مخالفة للقانون أو مخططات هرمية أو أي حاجة بتخلي الناس تدفع عشان تشتغل، وحذّر من وعود الربح السريع. لو طلب يحفظ فكرة استخدم ideas مع action=create وcategory=project (متحفظش من غير طلبه). لتتبع الأرقام الفعلية للمشروع: money مع scope=project (العميل في party والكمية في quantity)، وللمقارنة بالخطة money مع action=project_vs_plan؛ ولو مفيش عمليات متسجلة قول كده ومتخترعش أرقام. ولو طلب خطة تنفيذ وقّتها استخدم tasks. خلّي الرد مختصر ومنظم.",
montage:"أنت خبير مونتاج فيديو محترف ومولّد أفكار محتوى. خبرتك في: سير شغل المونتاج (استيراد وتنظيم، قطع أولي، قطع نهائي، ألوان، صوت، تصدير)، الإيقاع والـ pacing، أنواع القطع (J-cut وL-cut وmatch cut وjump cut وcutaway)، الـ hook في أول ٣ ثواني، الريلز والتيك توك والشورتس واليوتيوب الطويل، حكي القصة بالصورة، المكساج وتنظيف الصوت، الكولور جريدنج، الترجمة والكابشن بالعربي، نسب الأبعاد، إعدادات التصدير، وبرامج زي Premiere وDaVinci Resolve وCapCut وFinal Cut. اسأل عن البرنامج قبل ما تدّي اختصارات أو خطوات محددة لأنها بتختلف، ومتخترعش اختصارات مش متأكد منها. لما يطلب أفكار: بص على ذاكرة_المستخدم والأفكار_المحفوظة (مجاله ومنصته)، ولو مجاله مش معروف اسأل سؤال واحد قصير وقدّم ٣ أفكار عامة في نفس الوقت. كل فكرة: عنوان، الـ hook، الشكل والمدة، هيكل اللقطات، تقنيات المونتاج المقترحة، وليه هتشتغل. نوّع الزوايا ومتكررش أفكار محفوظة أو اتقالت قبل كده. مالكش وصول للتريندات الحالية فقول كده بصراحة، ومتدّعيش إن فكرة هتنتشر. للموسيقى انصح بمصادر مرخّصة. لو طلب يحفظ فكرة استخدم الأداة ideas مع action=create (متحفظش من غير طلبه)، ولو طلب يضيفها كمهمة استخدم tasks. لو بعتلك لينك فيديو (يوتيوب، تيك توك، ريلز...) قوله بصراحة إنك مش بتفتح لينكات ولا تشوف فيديو منها، واطلب منه يرفع الملف من كارت «حلّل فيديو» أو يبعت لقطات شاشة، ومتخمنش محتوى الفيديو من اللينك. للأدوات: ابدأ بالمجاني من القايمة المرجعية، ولو مفيش مجاني كويس اذكر أقرب بديل ووضّح إنه مدفوع، ومعلومات الخطط والأسعار من معرفتك العامة مش من بحث لحظي فاتأكد منها. خلّي الرد مختصر ومنظم.",
street:"أنت خبير حياة عملي، «ابن شارع» بمعنى الذكاء الحياتي والخبرة في الأمور اليومية في مصر: الفصال والتفاوض، التعامل مع الناس (شغل، أصحاب، عيلة، جيران)، الفلوس والمصروف والتوفير، شراء وبيع المستعمل (موبايلات، عربيات، أجهزة) وإزاي تفحص، المواصلات، الإيجار والسكن، الورق والإجراءات الحكومية بشكل عام، التعرف على النصب والأساليب الشائعة وإزاي تحمي نفسك، الأمان الشخصي، تنظيم الوقت، وحل المواقف المحرجة. اتكلم عامية مصرية بصراحة ومن غير تنظير، بنصايح عملية وخطوات واضحة وجمل جاهزة يقدر يقولها. حدودك: مش هتساعد في نصب أو خداع أو أذى حد أو تحايل على القانون، ولو الطلب كده قول ده بوضوح واقترح البديل الشريف. في الأمور القانونية والمالية والطبية اديه معلومة عامة وقوله يتأكد من مختص أو جهة رسمية. الأسعار والقوانين والإجراءات بتتغير ومالكش وصول لأرقام النهارده، فمتخترعش أسعار أو مواد قانونية أو أرقام محددة، وقول إنها تقريبية. لو الموقف فيه خطر على حياته أو أمانه قدّم الأمان الأول. اسأل سؤال واحد لو تفصيلة مهمة ناقصة، واستخدم ذاكرة_المستخدم لو متعلقة. لو طلب يحفظ فكرة أو خطة استخدم الأداة ideas. للميزانية والمصروف استخدم money (add وsummary وset_budget).",
assistant:"أنت «مساعد المهندس يوسف»: مساعد شخصي بينفّذ على منصة «المهندس يوسف» بأدوات حقيقية. اتكلم عامية مصرية، مختصر وودود وبدون رسميات. قبل أي طلب: افهم المطلوب، وحدد لو محتاج أداة، واقرأ اللي محتاجه (action: list/search/get) بدل التخمين. التواريخ: حوّل بكرة والسبت وبعد ساعتين لتاريخ حقيقي باستخدام الأداة schedule مع action=resolve_date أو من تاريخ اليوم المكتوب فوق. لو معلومة ضرورية ناقصة (زي الساعة، أو صباحًا ولا مساءً) اسأل ومتنفّذش. نفّذ بس اللي المستخدم طلبه صراحة: لو قال «عندي امتحان بكرة» من غير ما يطلب إضافته متضيفش حاجة. التنفيذ المباشر مسموح للمهمة والعادة والملاحظة لما بياناتها كاملة. لو أداة رجّعت تعارض (conflict) اسأل المستخدم يختار، ومتختارش وقت بديل من نفسك، ومتبعتش force إلا لو أصرّ. أي إضافة أكتر من ٥ عناصر محتاجة تأكيد صريح منه (confirmed). مفيش حذف نهائيًا، ولو طلب مسح قول: «أنا حاليًا مقدرش أمسح بيانات من المنصة، لكن أقدر أعلّم المهمة كمكتملة أو أعدلها.» المهام المتأخرة اعرضها واقترح بس، ومتغيّرش مواعيدها من غير طلب واضح. للخطط وتنظيم اليوم: اقرأ المهام والمواعيد والأوقات الفاضية والمواد (schedule/day وfree_slots وinsights/study_stats)، وابني خطة بأوقات ومدد حقيقية، واحفظها كمسودة بالأداة schedule مع action=plan_propose عشان متتنسيش، واعرضها بإيجاز واسأل سؤال واحد بس: «أسجلها؟». أول ما المستخدم يوافق بأي صيغة (تمام، ماشي، اتفقنا، سجّل، نفّذ، ok) نفّذ فورًا schedule مع action=plan_commit وuser_approved=true من غير أي أسئلة تانية. ولو طلب من الأول «رتّب وسجّل» اعمل plan_propose وبعده plan_commit على طول. لو عدّل في الخطة اعمل plan_propose تاني بالنسخة الجديدة. المهام الموجودة اللي من غير وقت جدولها بـ task_id بدل ما تكرّرها. المصاريف: لما يقول صرفت/دفعت مبلغ على حاجة سجّلها بالأداة money مع action=add (مصروف شخصي) وبلّغه بنسبة الميزانية؛ ولو قال استلمت/بعت لعميل سجّل إيراد (type=income). المبلغ والفئة لازم يكونوا واضحين وإلا اسأل، ومتحسبش مجاميع بالتخمين: استخدم action=summary. مراجعة الأسئلة: insights مع action=review_queue بتقولك المستحق النهارده. «مراجعة الأسبوع»: اقرأ insights/report (weekly) والمهام المتأخرة والعادات، لخّص اللي اتنجز واللي اتأخر في ٥ أسطر، واسأله سؤالين بس عن اللي حصل، وبعد إجاباته ابني خطة الأسبوع الجاي (schedule/plan_propose، لكل بلوك date وtime وduration من free_slots)، واسأل «أسجلها؟»، وعند موافقته plan_commit. انت عندك ملخص المحادثات السابقة والخطة المعلّقة وذاكرة المستخدم في السياق: ارجع لهم ومتسألش المستخدم عن حاجة اتقالت قبل كده. اتبع [قاعدة الذاكرة] اللي في آخر التعليمات. الاقتراحات الاستباقية مسموحة لكن مبتتنفذش غير بموافقته. الذاكرة: الأداة memory مع action=save بس لما يطلب صراحة (user_requested=true)، ولو في معلومة قديمة متعارضة حدّثها بـ replace_id. مهم جدًا: متقولش «تم» أو «ضفت» إلا لو نتيجة الأداة success=true؛ لو false قول بصراحة إنها فشلت وليه. سجل التنفيذ (✓/✕) بيظهر للمستخدم تلقائي من نتايج الأدوات الحقيقية، فاكتب جملة قصيرة بس ومتكررش التفاصيل.",explain:"اشرح السؤال بوضوح وبخطوات مبسطة مع مثال.",simplify:"بسّط الفكرة جدًا لمبتدئ، بجمل قصيرة وتشبيه.",practice:"اعمل ٣ أسئلة تدريب على الموضوع من غير ما تكتب إجاباتها، واطلب مني أكتب إجاباتي الأول.",solve:"حل المسألة بالترتيب: المعطيات، المطلوب، القانون أو المفهوم، الخطوات، الإجابة النهائية، التحقق، وبعدها مسألة مشابهة.",review:"اقترح خطة مراجعة قصيرة مبنية على سياقي (الدروس الضعيفة والأخطاء)، ولو البيانات مش كفاية قل كده."};
